<!DOCTYPE html>
<html>
<head>
  <title>TourSense</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>

  <div class="header-bar">
    <h1>Welcome to TourSense</h1>
    <div id="filters">
      <label><input type="checkbox" class="category-filter" value="park" checked> Park</label>
      <label><input type="checkbox" class="category-filter" value="accommodation" checked> Accommodation</label>
      <label><input type="checkbox" class="category-filter" value="restaurant" checked> Restaurant</label>
      <label><input type="checkbox" class="category-filter" value="librarymuseum" checked> Library & museum</label>
    </div>
  </div>

  <div id="map"></div>

<div class="legend">
  <strong>Sentiment</strong>
  <div class="legend-row"><span class="dot green"></span> Positive</div>
  <div class="legend-row"><span class="dot amber"></span> Neutral</div>
  <div class="legend-row"><span class="dot red"></span> Negative</div>
</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
